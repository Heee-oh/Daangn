<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#122620">
    <title>Daangn Controller Test Console</title>
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
<main class="layout">
    <header class="panel hero">
        <p class="eyebrow">DAANGN MARKET</p>
        <h1>Controller Test Console</h1>
        <p>모든 컨트롤러 엔드포인트를 즉시 호출하고 응답을 바로 확인할 수 있는 테스트 화면입니다.</p>
    </header>

    <section class="panel session-panel">
        <h2>Session</h2>
        <div class="row">
            <label for="baseUrl">Base URL</label>
            <input id="baseUrl" type="text" value="http://localhost:8080">
            <button id="saveConfigBtn" type="button">Save</button>
        </div>
        <div class="row">
            <label for="tokenInput">Access Token</label>
            <input id="tokenInput" type="text" placeholder="Bearer token without prefix">
            <button id="applyTokenBtn" type="button">Apply</button>
            <button id="clearTokenBtn" type="button" class="ghost">Clear</button>
        </div>
        <p class="hint">Current memberId: <strong id="currentMemberId">-</strong></p>
    </section>

    <section class="controller-grid">
        <article class="panel">
            <h2>AuthController</h2>
            <div class="stack">
                <label for="authPhone">phone_number</label>
                <input id="authPhone" type="text" placeholder="01012345678">
                <label for="authNickname">nickname (signup)</label>
                <input id="authNickname" type="text" placeholder="tester">
            </div>
            <div class="actions">
                <button id="signupBtn" type="button">POST /api/auth/signup</button>
                <button id="loginBtn" type="button" class="ghost">POST /api/auth/login</button>
            </div>
        </article>

        <article class="panel">
            <h2>Shared Inputs</h2>
            <div class="stack">
                <label for="regionIdInput">region_id</label>
                <input id="regionIdInput" type="number" value="11000">
                <label for="listingIdInput">listing_id</label>
                <input id="listingIdInput" type="number" value="">
                <label for="interestListingIdInput">interest listing_id</label>
                <input id="interestListingIdInput" type="number" value="">
                <label for="buyerIdInput">buyer_id</label>
                <input id="buyerIdInput" type="number" value="200">
                <label for="latInput">lat</label>
                <input id="latInput" type="number" step="0.000001" value="37.5665">
                <label for="lngInput">lng</label>
                <input id="lngInput" type="number" step="0.000001" value="126.9780">
            </div>
        </article>

        <article class="panel">
            <h2>MemberRegionController</h2>
            <div class="actions">
                <button id="verifyRegionBtn" type="button">POST /api/members/me/regions/{region_id}/verify</button>
            </div>
            <p class="hint">lat/lng + region_id를 사용합니다.</p>
        </article>

        <article class="panel">
            <h2>MemberController</h2>
            <div class="actions two-col">
                <button id="memberMeBtn" type="button">GET /api/members/me</button>
                <button id="memberRegionsBtn" type="button">GET /api/members/me/regions</button>
                <button id="updateMemberBtn" type="button">PATCH /api/members/me</button>
                <button id="updateProfileBtn" type="button">PUT /api/members/me/profile-image</button>
                <button id="updateNicknameBtn" type="button">PATCH /api/members/me/nickname</button>
                <button id="addInterestBtn" type="button">PUT /api/members/me/interests/{listing_id}</button>
                <button id="deleteInterestBtn" type="button">DELETE /api/members/me/interests/{listing_id}</button>
                <button id="listInterestsBtn" type="button">GET /api/members/me/interests</button>
                <button id="withdrawBtn" type="button" class="danger">DELETE /api/members/me</button>
            </div>
            <label for="updateMemberBody">PATCH /me body (JSON)</label>
            <textarea id="updateMemberBody" spellcheck="false">{
  "nickname": "updated-nick",
  "profile_image": "https://img.example/profile.png"
}</textarea>
            <label for="profileImageInput">profile_image</label>
            <input id="profileImageInput" type="text" value="https://img.example/profile.png">
            <label for="nicknameInput">nickname</label>
            <input id="nicknameInput" type="text" value="updated-nick">
            <div class="row">
                <label for="lastInterestIdInput">last_interest_id</label>
                <input id="lastInterestIdInput" type="number" placeholder="optional">
                <label for="interestSizeInput">size</label>
                <input id="interestSizeInput" type="number" value="20">
            </div>
        </article>

        <article class="panel">
            <h2>ListingController</h2>
            <div class="actions two-col">
                <button id="getListingsBtn" type="button">GET /api/listings</button>
                <button id="createDraftBtn" type="button">POST /api/listings/drafts</button>
                <button id="getListingBtn" type="button">GET /api/listings/{listing_id}</button>
                <button id="updateListingBtn" type="button">PUT /api/listings/{listing_id}</button>
                <button id="publishBtn" type="button">POST /publish</button>
                <button id="hideBtn" type="button">POST /hide</button>
                <button id="unhideBtn" type="button">POST /unhide</button>
                <button id="reserveBtn" type="button">POST /reserve</button>
                <button id="cancelReserveBtn" type="button">POST /reserve/cancel</button>
                <button id="soldOutBtn" type="button">POST /sold-out</button>
                <button id="deleteListingBtn" type="button" class="danger">DELETE /api/listings/{listing_id}</button>
            </div>
            <div class="row">
                <label for="lastListingIdInput">last_listing_id</label>
                <input id="lastListingIdInput" type="number" placeholder="optional">
            </div>
            <label for="listingUpdateBody">PUT /listings/{listing_id} body (JSON)</label>
            <textarea id="listingUpdateBody" spellcheck="false">{
  "title": "Updated title",
  "description": "Updated description",
  "category_id": 1,
  "price_amount": 1000,
  "is_free": false,
  "hope_location": {
    "region_id": 11000,
    "lat": 37.5665,
    "lng": 126.978
  },
  "image_urls": [
    "https://img/1.png"
  ]
}</textarea>
        </article>
    </section>

    <section class="panel response-panel">
        <h2>Live Response</h2>
        <div class="response-head">
            <p id="requestLine">-</p>
            <p><span id="statusBadge" class="badge">-</span> <span id="durationText">-</span></p>
        </div>
        <pre id="responseBody">{}</pre>
        <h3>History</h3>
        <ul id="historyList" class="history"></ul>
    </section>
</main>

<script src="./app.js" type="module"></script>
</body>
</html>
